<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>حلو الملك | لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-variables.css">
  <link rel="stylesheet" href="admin-layout.css">
  <link rel="stylesheet" href="admin-components.css">
  <link rel="stylesheet" href="admin-responsive.css">
  <link rel="stylesheet" href="admin-extra.css">
</head>
<body>
  <aside>
    <div class="logo">حلو الملك</div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1>أهلًا بك</h1>
        <p id="sub">ملخص الأداء اليوم</p>
      </div>
      <div class="tools">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="ابحث في الطلبات">
        </label>
        <button class="bell" id="bell" aria-label="الإشعارات">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>
          <i id="badge" style="display:none">0</i>
        </button>
        <div class="drop" id="drop"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>

  <!-- شاشة تسجيل دخول الأدمن -->
  <div id="login">
    <form id="loginForm" class="lbox">
      <h2>حلو الملك</h2>
      <p>تسجيل دخول لوحة التحكم</p>
      <label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="username">
      <label>كلمة المرور</label><input name="pass" type="password" required autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn" style="width:100%">دخول</button>
    </form>
  </div>

  <div class="m-bg" id="modal" hidden></div>
  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="admin-seed.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-utils.js"></script>
  <script src="admin-store.js"></script>
  <script src="admin-nav.js"></script>
  <script src="admin-dashboard.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-app.js"></script>
</body>
</html>
